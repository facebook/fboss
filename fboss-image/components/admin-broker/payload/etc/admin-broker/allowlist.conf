# Units the admin broker may control, with their allowed verbs. Shipped in
# the image: edit this file to change the set at build time. A bare unit
# allows STATUS only. Template entries (name@.service) accept a numeric
# instance only, e.g. fboss_hw_agent@0.service.
fboss_sw_agent.service: STATUS, START, STOP, RESTART
fboss_hw_agent@.service: STATUS, START, STOP, RESTART
qsfp_service.service: STATUS, START, STOP, RESTART
fsdb.service: STATUS, START, STOP, RESTART
platform_manager.service: STATUS, START, STOP, RESTART

# linux_ngbde sizes its DMA pool at load time and the SDK expects 128 MB. The
# previous loader passed this on the insmod command line; modprobe takes it
# from here instead.
options linux_ngbde dma_size=128

# The values the internal Leaba kmod installer passes on its modprobe line.
options leaba_module m_desc_buffer_size_bytes=2048 m_polling_interval_usec=100

# Raise how often the distro logrotate runs, so that the maxsize cap in
# /etc/logrotate.d/fboss is meaningful.
#
# logrotate rotates a given file at most once per run, so the run interval --
# not maxsize -- is what actually bounds how large a live log can get. At the
# stock daily cadence a busy qsfp_service reaches many GB between runs and
# maxsize degrades from a cap into a trigger.
#
# This affects every logrotate config on the box, but only in how often they
# are evaluated: time-based entries such as /var/log/messages are governed by
# their own daily/weekly directives and are simply checked and skipped. Only
# size-triggered entries rotate sooner, which is the intent.
#
# The empty OnCalendar= is required: drop-ins append to list-valued settings,
# so the inherited daily value has to be cleared before setting a new one.
[Timer]
OnCalendar=
OnCalendar=*:0/15
AccuracySec=1min
# Stock CentOS 9 leaves this unset, so it is already 0. Pinned so that an
# upstream unit that later adds a randomized delay cannot silently loosen the
# interval this drop-in exists to tighten.
RandomizedDelaySec=0

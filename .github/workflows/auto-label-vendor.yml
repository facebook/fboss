name: Validate and Label PR Metadata

on:
  # Test-only: execute this branch's workflow definition for PR 1619.
  # The production workflow continues to use pull_request_target.
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-pr-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - uses: actions/github-script@v9
        with:
          script: |
            const labelPullRequestMetadata = require(
              './.github/scripts/label-pr-metadata.js'
            );
            await labelPullRequestMetadata({ github, context, core });

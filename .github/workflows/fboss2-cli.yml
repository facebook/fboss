name: Build & Test fboss2 CLI
run-name: Build & Test fboss2 CLI
on:
  # Allow on pull request
  pull_request:
    paths:
      - 'fboss-sim/**'
      - 'fboss/cli/**'
      - 'cmake/CliFboss2.cmake'
      - 'cmake/CliFboss2Test.cmake'
      - 'cmake/CliFboss2TestConfig.cmake'
      - 'cmake/CliFboss2TestIntegrationTest.cmake'
      - '.github/workflows/fboss2-cli.yml'
  # Allow manually triggering the workflow
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: cli
        type: choice
        options:
          - cli
          - simulator
          - all
  # Also schedule the workflow to run twice daily
  # ShipIt job will sync hourly around HH:21, so schedule the run with 15 minute offset
  schedule:
    # Run daily at 1:36AM UTC = 6:36PM PDT
    # Run daily at 1:36PM UTC = 6:36AM PDT
    - cron: '36 1,13 * * *'

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fboss2-CLI-Build:
    if: github.repository_owner == 'facebook'
    runs-on: 32-core-ubuntu
    timeout-minutes: 120
    steps:
      - run: echo "Confirming hardware specifications:"; sudo lscpu
      - name: Clean workspace
        run: sudo rm -rf ${{ github.workspace }}/*
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Build fake-SAI agent and fboss2 targets
        run: >
          sudo
          ./fboss/oss/scripts/docker-build.py
          --scratch-path
          ${{ github.workspace }}/.build_dir
          --target
          fboss_fake_agent_targets
          --target
          fboss2_targets
          --no-docker-output
          --env-var
          BUILD_SAI_FAKE
          --env-var
          GITHUB_ACTIONS_BUILD
          --local
          --num-jobs
          18
          &&
          sudo
          chown
          -R
          runner:runner
          ${{ github.workspace }}
      - name: Package fboss2 CLI binaries and library dependencies
        run: >
          sudo
          docker
          run
          -v
          ${{ github.workspace }}:/var/FBOSS/fboss:z
          -v
          ${{ github.workspace }}/.build_dir:/var/FBOSS/tmp_bld_dir:z
          --cap-add=CAP_AUDIT_WRITE
          --name
          FBOSS2_CLI_PACKAGE_CONTAINER
          fboss_image:latest
          python3
          /var/FBOSS/fboss/fboss/oss/scripts/package-fboss.py
          --copy-root-libs
          --scratch-path=/var/FBOSS/tmp_bld_dir
          --compress
      - name: Save Docker image
        run: sudo docker save fboss_image:latest | zstd -o ${{ github.workspace }}/.build_dir/fboss_docker_image.tar.zst
      - name: Collect fboss-sim artifacts
        run: >
          sudo
          docker
          run
          --rm
          -v
          ${{ github.workspace }}:/var/FBOSS/fboss:z
          --cap-add=CAP_AUDIT_WRITE
          fboss_image:latest
          python3
          /var/FBOSS/fboss/fboss-sim/scripts/fboss-sim-docker-package.py
          --collect-only
      - name: Restore workspace ownership
        run: sudo chown -R runner:runner ${{ github.workspace }}
      - name: Build fboss-sim runtime image
        run: python3 fboss-sim/scripts/fboss-sim-docker-package.py --build-only
      - name: Save fboss-sim runtime image
        run: sudo docker save fboss_sim_runtime_runner:latest | zstd -o ${{ github.workspace }}/.build_dir/fboss_sim_runtime_image.tar.zst
      - name: Upload fboss2 CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fboss2-cli
          path: |
            ${{ github.workspace }}/.build_dir/fboss_bins.tar.zst
            ${{ github.workspace }}/.build_dir/fboss_docker_image.tar.zst
          # Explicitly set the retention at the object level
          retention-days: 14
      - name: Upload fboss-sim runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: fboss2-fake-sai-runtime
          path: ${{ github.workspace }}/.build_dir/fboss_sim_runtime_image.tar.zst
          retention-days: 1
  fboss2-CLI-Test:
    if: >-
      github.repository_owner == 'facebook' &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'cli' || inputs.suite == 'all')
    runs-on: 4-core-ubuntu
    needs: fboss2-CLI-Build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Download artifact with test binaries
        uses: actions/download-artifact@v8
        with:
          name: fboss2-cli
      - run: ls ${{ github.workspace }}
      - name: Load Docker image
        run: zstd -dc ${{ github.workspace }}/fboss_docker_image.tar.zst | sudo docker load
      - name: Run unit tests
        run: >
          sudo
          ./fboss/oss/scripts/github_actions/docker-unittest.py
          ${{ github.workspace }}/fboss_bins.tar.zst
          &&
          sudo
          chown
          -R
          runner:runner
          ${{ github.workspace }}
  fboss2-Fake-SAI-Integration-Test:
    if: >-
      github.repository_owner == 'facebook' &&
      (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.suite == 'simulator' || inputs.suite == 'all')))
    runs-on: 32-core-ubuntu
    needs: fboss2-CLI-Build
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Download fboss-sim runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: fboss2-fake-sai-runtime
      - name: Load fboss-sim runtime image
        run: zstd -dc ${{ github.workspace }}/fboss_sim_runtime_image.tar.zst | sudo docker load
      - name: Start fboss-sim runtime container
        id: start
        run: python3 fboss-sim/scripts/fboss-sim-docker-run.py
      - name: Wait for agent services to be ready
        env:
          CONTAINER: ${{ steps.start.outputs.container_name }}
        run: |
          for i in $(seq 1 30); do
            if docker exec "$CONTAINER" /opt/fboss/bin/fboss2 show interface >/dev/null 2>&1; then
              echo "✓ Agent ready after $(( (i - 1) * 2 ))s"
              exit 0
            fi
            echo "  [$(( (i - 1) * 2 ))s] not ready yet, retrying..."
            sleep 2
          done
          echo "❌ Agent not ready"
          # Split mode is the default, and each unit logs to its own file.
          for log in sw_agent hw_agent0; do
            echo "===== /var/facebook/logs/fboss/$log.log (last 50) ====="
            docker exec "$CONTAINER" tail -n 50 "/var/facebook/logs/fboss/$log.log" || true
          done
          exit 1
      - name: Run fboss2 integration test
        env:
          CONTAINER: ${{ steps.start.outputs.container_name }}
        run: docker exec "$CONTAINER" /opt/fboss/bin/fboss2_integration_test
